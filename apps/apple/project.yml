# Xcode のプロジェクトはこのファイルから XcodeGen で作る（`scripts/ui-test.sh` が作り直す）。
# 生成した Nanaichi.xcodeproj はコミットしない。差分がレビューできないため
name: Nanaichi
options:
  # 画面は日本語だけなので、英語の Mac でも日本語のアプリとして動かす
  developmentLanguage: ja
  deploymentTarget:
    macOS: "26.0"
    # iPhone で文字にするのに使う SpeechAnalyzer が iOS 26 から（ADR 0031）
    iOS: "26.0"
    watchOS: "26.0"
  bundleIdPrefix: app.nanaichi
packages:
  NanaichiKit:
    path: NanaichiKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 当面は自分用のビルドだけなので、Apple Developer Program なしでローカルに署名する（ADR 0028）
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Nanaichi:
    type: application
    platform: macOS
    # Shared は Mac と iPhone で同じタイマーの画面とモデル、音と通知の予約、ログインと記録先の切り替え、取り込み
    sources: [Nanaichi, Shared]
    dependencies:
      - package: NanaichiKit
        product: NanaichiDomain
      - package: NanaichiKit
        product: NanaichiPresentation
      - package: NanaichiKit
        product: NanaichiDevice
      - package: NanaichiKit
        product: NanaichiAccount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nanaichi.mac
        PRODUCT_NAME: nanaichi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Nanaichi/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: nanaichi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: YES
        # アカウントの記録先（https と wss の nanaichi.app）に繋ぐ。サンドボックスは外への通信を既定で止める
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES
  NanaichiUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [NanaichiUITests]
    dependencies:
      - target: Nanaichi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Nanaichi
  # iPhone（と iPad）のアプリ。タイマーとジャーナル記入だけを使う（ADR 0031）。ログインするとアカウントの記録先で同期する
  NanaichiPhone:
    type: application
    platform: iOS
    sources: [NanaichiPhone, Shared]
    dependencies:
      - package: NanaichiKit
        product: NanaichiDomain
      - package: NanaichiKit
        product: NanaichiPresentation
      - package: NanaichiKit
        product: NanaichiDevice
      - package: NanaichiKit
        product: NanaichiAccount
      - package: NanaichiKit
        product: NanaichiWatchLink
      # Watch のアプリを同梱する（ADR 0031）
      - target: NanaichiWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nanaichi.ios
        PRODUCT_NAME: nanaichi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: NanaichiPhone/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: nanaichi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # iPad は iPhone の画面がそのまま動けばよい（Issue #70）
        TARGETED_DEVICE_FAMILY: "1,2"
  NanaichiPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NanaichiPhoneUITests]
    dependencies:
      - target: NanaichiPhone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NanaichiPhone
  # Watch のアプリ（ADR 0031）。iPhone のアプリに同梱し、開始と中断は WatchConnectivity で iPhone に頼む。記録先は持たない
  NanaichiWatch:
    type: application
    platform: watchOS
    # 色と記号は iPhone の画面と同じもの
    sources: [NanaichiWatch, Shared/PhaseStyle.swift]
    dependencies:
      - package: NanaichiKit
        product: NanaichiDomain
      - package: NanaichiKit
        product: NanaichiPresentation
      - package: NanaichiKit
        product: NanaichiWatchLink
      # XCUITest で iPhone の代わりにする記録先（`StubPhoneLink`、デバッグのビルドだけで使う）
      - package: NanaichiKit
        product: NanaichiDevice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nanaichi.ios.watchkitapp
        PRODUCT_NAME: nanaichi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: NanaichiWatch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: nanaichi
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.nanaichi.ios
        # 初版は iPhone を経由して動く（ADR 0031）
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
  NanaichiWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [NanaichiWatchUITests]
    dependencies:
      - target: NanaichiWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NanaichiWatch
schemes:
  Nanaichi:
    build:
      targets:
        Nanaichi: all
    test:
      targets: [NanaichiUITests]
  NanaichiPhone:
    build:
      targets:
        NanaichiPhone: all
    test:
      targets: [NanaichiPhoneUITests]
  NanaichiWatch:
    build:
      targets:
        NanaichiWatch: all
    test:
      targets: [NanaichiWatchUITests]
