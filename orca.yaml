scripts:
  # core.hooksPath はワークツリーの間で共有される設定なので、このワークツリーだけの値を先に置く。
  # 共有の値がメインのチェックアウトの絶対パスになっていると、vp hooks enable は
  # 「already set, skipping」でこのワークツリーにフックの振り分け（.vite-hooks/_）を作らず、
  # フックはメインの node_modules の vp で動いてしまう（Issue #23）。
  # ワークツリーの値を先に置けば、vp install の prepare と vp hooks enable がここに振り分けを作る。
  setup: |
    git config extensions.worktreeConfig true
    git config --worktree core.hooksPath "$ORCA_WORKTREE_PATH/.vite-hooks/_"
    vp install
    vp hooks enable
    cp "$ORCA_ROOT_PATH/apps/web/.dev.vars" "$ORCA_WORKTREE_PATH/apps/web/.dev.vars"
