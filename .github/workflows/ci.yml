name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ドキュメントだけの変更かを判定する。ドキュメントだけなら、テスト・ビルド・E2E を飛ばす。
  # ドキュメントとみなすのは Markdown、docs/、エージェント向けの設定（.agents/、.claude/、skills-lock.json）。
  # 判定できないとき（新しいブランチの最初の push、比較できるファイル数の上限を超えたときなど）は全部走らせる。
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            # compare API が返すファイルは 300 件まで。それを超えたら判定せず全部走らせる
            if files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq 'if (.files | length) < 300 then .files[].filename else error("too many files") end'); then
              echo "$files"
              if ! echo "$files" | grep -qvE '(\.md$|^docs/|^\.agents/|^\.claude/|^skills-lock\.json$)'; then
                code=false
                echo "::notice title=ドキュメントだけの変更::テスト・ビルド・E2E を飛ばし、vp check（書式・lint・型）だけを走らせます。"
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      # 書式（Markdown を含む）・lint・型はドキュメントだけの変更でも確かめる
      - run: vp check
      - if: needs.changes.outputs.code == 'true'
        run: vp test
      # 未使用のファイル・export・依存（AGENTS.md「7. ツールと作業の進め方」）。push 時のフックと同じ検査
      - if: needs.changes.outputs.code == 'true'
        run: vp exec knip
      - if: needs.changes.outputs.code == 'true'
        run: vp run -r build

  # 画面を実際のブラウザ（chromium）で動かす E2E テスト（docs/E2E.md）。
  # ローカルの D1 は毎回空から始まり、ランナーが開発サーバー（vp dev）を起動する。
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      # vite-plus 0.2 の setup-vp は pnpm を PATH に入れないので、vp から呼ぶ
      - run: vp exec --filter web e2e-web install chromium --with-deps
      - run: vp run web#test:e2e
      # 結果の要約を実行結果の画面に出す
      - if: always()
        run: |
          if [ -f apps/web/.e2e/summary.md ]; then cat apps/web/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      # 失敗したテストの trace（.e2e/results/<テスト>/trace.md）と開発サーバーのログ（.e2e/logs/app.log）を残す。
      # リトライで通った（flaky な）テストの trace も見られるよう、成功したときも残す
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-results
          path: apps/web/.e2e/
          include-hidden-files: true
          retention-days: 14

  # PR ごとのプレビューを作り、URL を PR にコメントする（ADR 0022）。
  # フォークと Dependabot の PR には secrets が渡らないので作らない。チェックだけで確かめる。
  preview:
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.code == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # 同じ PR の古いプレビューは待たない。新しい push の分だけを作る
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp run -r build
      # API トークンは本番と同じものなので、アップロードのステップにだけ渡す
      - name: プレビューのアップロード
        id: upload
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          vp exec wrangler versions upload -c wrangler.preview.jsonc --preview-alias "pr-$PR_NUMBER"
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # コメントは PR に1つだけ置き、更新のたびに書き換える
      - name: プレビューの URL をコメントする
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.upload.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(printf '<!-- nanaichi-preview -->\n**プレビュー:** %s\n\nコミット: %s\n\nログインせずに、この端末の記録で動きます（ADR 0022）。' "$URL" "$HEAD_SHA")
          id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- nanaichi-preview -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

  # デプロイに必要な Actions secrets が登録されているかを確かめる。
  # secrets はジョブの `if` で直接参照できないため、ここで判定して output に出す。
  # 未登録でも失敗させず（main の CI を赤くしない）、その旨をログと注釈に出す。
  deploy-secrets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # E2E が落ちた main はデプロイしない。ドキュメントだけの変更（E2E を飛ばした）もデプロイしない
    needs: [check, e2e]
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    steps:
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=デプロイをスキップ::Actions secrets（${missing[*]}）が未登録のため、デプロイしません。登録手順は docs/SETUP.md を参照。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  # main への push で、check と e2e が通ったあとに本番 D1 へのマイグレーション → wrangler deploy を実行する。
  deploy:
    needs: deploy-secrets
    if: needs.deploy-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # デプロイが重ならないようにする。走っている途中のデプロイは止めずに待たせる。
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      # @cloudflare/vite-plugin が dist/ に Worker と wrangler.json を出力し、
      # .wrangler/deploy/config.json で wrangler をそちらへ向ける
      - run: vp run -r build
      # 新しいコードが新しいスキーマを前提にするため、デプロイより先に適用する
      - name: 本番 D1 へのマイグレーション
        working-directory: apps/web
        run: vp exec wrangler d1 migrations apply nanaichi --remote
      - name: wrangler deploy
        working-directory: apps/web
        run: vp exec wrangler deploy
