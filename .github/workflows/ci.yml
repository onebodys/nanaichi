name: CI

on:
  push:
    branches: [main]
  # labeled: PR に ui-test のラベルを付けたら、Mac と iPhone のアプリの UI テストを走らせる（apple-ui）
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Mac と iPhone のアプリの UI テストを手で走らせる（Actions の画面の Run workflow）
  workflow_dispatch:

# 同じ PR に続けて push したら、古い実行を取り消す（macOS のランナーの分数を無駄にしないため）。
# ラベルを付けた実行は別の組にして、push の実行を取り消さない。main への push は取り消さない
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ドキュメントだけの変更かを判定する。ドキュメントだけなら、テスト・ビルド・E2E を飛ばす。
  # ドキュメントとみなすのは Markdown、docs/、エージェント向けの設定（.agents/、.claude/、skills-lock.json）。
  # 判定できないとき（新しいブランチの最初の push、比較できるファイル数の上限を超えたときなど）は全部走らせる。
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      apple: ${{ steps.diff.outputs.apple }}
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          HAS_UI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ui-test') }}
        run: |
          code=true
          apple=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            # compare API が返すファイルは 300 件まで。それを超えたら判定せず全部走らせる
            if files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq 'if (.files | length) < 300 then .files[].filename else error("too many files") end'); then
              echo "$files"
              if ! echo "$files" | grep -qvE '(\.md$|^docs/|^\.agents/|^\.claude/|^skills-lock\.json$)'; then
                code=false
                echo "::notice title=ドキュメントだけの変更::テスト・ビルド・E2E を飛ばし、ADR の番号の検査と vp check（書式・lint・型）だけを走らせます。"
              fi
              # Swift のテストは、Swift のコードかゴールデンケース（TS のテストが書き出す）が変わったときだけ走らせる
              if ! echo "$files" | grep -qE '(^apps/apple/|^fixtures/golden/|^\.github/workflows/)'; then
                apple=false
              fi
            fi
          fi
          # Mac と iPhone のアプリの UI テスト（XCUITest）は macOS のランナーで長くかかるので、Swift のコードが変わっていて、
          # 手で走らせたか、PR に ui-test のラベルがあるときだけ走らせる（docs/E2E.md）
          ui=false
          if [ "$apple" = true ]; then
            case "$EVENT/$ACTION" in
              workflow_dispatch/*) ui=true ;;
              pull_request/labeled) [ "$ADDED_LABEL" = ui-test ] && ui=true ;;
              pull_request/*) [ "$HAS_UI_LABEL" = true ] && ui=true ;;
            esac
          fi
          # ラベルを付けただけの実行では、push のときに走らせたテストを繰り返さない
          if [ "$ACTION" = labeled ]; then
            code=false
            apple=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "apple=$apple" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    # ラベルを付けただけの実行では、push のときに確かめたものを繰り返さない
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # ドキュメントだけの変更でも走らせる。ADR を足す PR はたいていドキュメントだけなので
      - run: sh scripts/check-adr-numbers.sh
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      # 書式（Markdown を含む）・lint・型はドキュメントだけの変更でも確かめる
      - run: vp check
      - if: needs.changes.outputs.code == 'true'
        run: vp test
      # 自動終了の alarm の TLA+ モデルと、vp test が書き出した実装のトレース（.agents/skills/auto-end-alarm）。
      # ubuntu のランナーには Java が入っている。TLC は check.mjs が版と SHA-256 を固定して取ってくる
      - if: needs.changes.outputs.code == 'true'
        run: node specs/auto-end-alarm/check.mjs
      # 未使用のファイル・export・依存（AGENTS.md「7. ツールと作業の進め方」）。push 時のフックと同じ検査
      - if: needs.changes.outputs.code == 'true'
        run: vp exec knip
      - if: needs.changes.outputs.code == 'true'
        run: vp run -r build

  # ミューテーションテスト（.agents/skills/mutation-test）。PR で変えた domain / workflows の行だけを回し、
  # 生き残ったミュータントを Step Summary に出す。報告だけで、生き残りがあっても落とさない（等価ミュータントで落ちる誤検知を避ける）。
  # mutator が動かないとき（テストが落ちる、設定が読めない）は落とす
  mutation:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # apps/web の tsconfig.json は参照だけを並べるので、ミュータントの型チェックは tsconfig.app.json で行う
    # （patches/ の @mizchi/mutator-typecheck、package.json の mutation と同じ）
    env:
      MUTATOR_TSCONFIG: tsconfig.app.json
    steps:
      # PR のマージコミットと、その1つ目の親（PR の base）を取る。--since はその親と比べる
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff --quiet HEAD^1 HEAD -- apps/web/src/domain apps/web/src/workflows; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "domain / workflows を変えていないので、ミューテーションテストを飛ばしました。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - if: steps.diff.outputs.changed == 'true'
        working-directory: apps/web
        run: |
          mkdir -p .mutator
          vp exec mutator --since HEAD^1 --reporter agent > .mutator/agent.json
      - if: steps.diff.outputs.changed == 'true'
        working-directory: apps/web
        run: node scripts/mutation-summary.ts .mutator/agent.json >> "$GITHUB_STEP_SUMMARY"

  # Apple のネイティブアプリ（apps/apple、ADR 0028）。ドメインがゴールデンケースで TS と一致することを確かめる。
  # macOS のランナーは Linux より遅く高いので、Swift のコードかゴールデンケースが変わったときだけ走らせる
  apple:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      # ランナーに入っている Xcode のうち、いちばん新しいものを使う
      - run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "::notice title=Xcode::$xcode"
      - working-directory: apps/apple/NanaichiKit
        run: swift test

  # Mac と iPhone のアプリの画面を XCUITest で動かし、撮った画面を PR にコメントする（Web の E2E と同じ形）。
  # 手で走らせたときか、PR に ui-test のラベルがあるときだけ（changes の ui）
  apple-ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      # アプリのスクリーンショットへのリンクを PR にコメントする
      pull-requests: write
    strategy:
      # 片方が落ちても、もう片方の画面は撮りきる
      fail-fast: false
      matrix:
        include:
          - platform: mac
            out: .uitest
            title: Mac
          - platform: iphone
            out: .uitest-iphone
            title: iPhone
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "::notice title=Xcode::$xcode"
      - run: brew install xcodegen
      - run: sh apps/apple/scripts/ui-test.sh ${{ matrix.platform }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: apple-ui-test-results-${{ matrix.platform }}
          path: apps/apple/${{ matrix.out }}/result.xcresult
          retention-days: 14
      # 一覧の HTML は Web の E2E と同じスクリプトで作る。ランナーの Node は TS をそのまま動かせないことがあるので、Node 24 を入れる
      - if: ${{ !cancelled() }}
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
      - if: ${{ !cancelled() }}
        env:
          OUT: apps/apple/${{ matrix.out }}
          TITLE: nanaichi の ${{ matrix.title }} アプリの画面
        run: node apps/web/scripts/screenshot-gallery.ts "$OUT/screenshots" "$OUT/screenshots-${{ matrix.platform }}.html" "$TITLE"
      - id: screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: apps/apple/${{ matrix.out }}/screenshots-${{ matrix.platform }}.html
          archive: false
          retention-days: 14
      - if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.screenshots.outputs.artifact-url != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.screenshots.outputs.artifact-url }}
          PLATFORM: ${{ matrix.platform }}
          TITLE: ${{ matrix.title }}
        run: |
          # Mac のコメントの印は、iPhone を足す前と同じにして、前からあるコメントを書き換え続ける
          if [ "$PLATFORM" = mac ]; then marker="<!-- apple-screenshots -->"; else marker="<!-- apple-screenshots-$PLATFORM -->"; fi
          body="$marker
          $TITLE アプリの画面のスクリーンショット（${SHA}）: [screenshots-$PLATFORM.html](${URL})"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body"
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body"
          fi

  # 画面を実際のブラウザ（chromium）で動かす E2E テスト（docs/E2E.md）。
  # ローカルの D1 は毎回空から始まり、ランナーが開発サーバー（vp dev）を起動する。
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # スクリーンショットへのリンクを PR にコメントする
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      # vite-plus 0.2 の setup-vp は pnpm を PATH に入れないので、vp から呼ぶ
      - run: vp exec --filter web e2e-web install chromium --with-deps
      - run: vp run web#test:e2e
      # 結果の要約を実行結果の画面に出す
      - if: always()
        run: |
          if [ -f apps/web/.e2e/summary.md ]; then cat apps/web/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      # 失敗したテストの trace（.e2e/results/<テスト>/trace.md）と開発サーバーのログ（.e2e/logs/app.log）を残す。
      # リトライで通った（flaky な）テストの trace も見られるよう、成功したときも残す
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-results
          path: apps/web/.e2e/
          include-hidden-files: true
          retention-days: 14
      # tests/screenshots.e2e.ts が撮った画面を、ダウンロードせずに見られる1枚の HTML にする（docs/E2E.md）
      - if: ${{ !cancelled() }}
        working-directory: apps/web
        run: node scripts/screenshot-gallery.ts
      - id: screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: apps/web/.e2e/screenshots.html
          archive: false
          include-hidden-files: true
          retention-days: 14
      - if: ${{ !cancelled() && steps.screenshots.outputs.artifact-url != '' }}
        env:
          URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          {
            echo "## 画面のスクリーンショット"
            echo
            echo "[画面の一覧（screenshots.html）]($URL)"
            echo
            ls apps/web/.e2e/screenshots | sed 's/^[0-9]*-//; s/\.png$//; s/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      # PR ごとに1件のコメントを更新し続ける。Dependabot の PR ではトークンが読み取り専用なので、失敗しても E2E の結果にしない
      - if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.screenshots.outputs.artifact-url != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          marker="<!-- e2e-screenshots -->"
          body="$marker
          画面のスクリーンショット（$SHA）: [screenshots.html]($URL)"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body"
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body"
          fi

  # PR ごとのプレビューを作り、URL を PR にコメントする（ADR 0025）。
  # フォークと Dependabot の PR には secrets が渡らないので作らない。チェックだけで確かめる。
  preview:
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.code == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # 同じ PR の古いプレビューは待たない。新しい push の分だけを作る
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp run -r build
      # PR のコードが動くジョブなので、本番に触れない専用のトークンを、アップロードのステップにだけ渡す
      - name: プレビューのアップロード
        id: upload
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          vp exec wrangler versions upload -c wrangler.preview.jsonc --preview-alias "pr-$PR_NUMBER"
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # コメントは PR に1つだけ置き、更新のたびに書き換える
      - name: プレビューの URL をコメントする
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.upload.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(printf '<!-- nanaichi-preview -->\n**プレビュー:** %s\n\nコミット: %s\n\nログインせずに、この端末の記録で動きます（ADR 0025）。' "$URL" "$HEAD_SHA")
          id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- nanaichi-preview -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

  # デプロイに必要な Actions secrets が登録されているかを確かめる。
  # secrets はジョブの `if` で直接参照できないため、ここで判定して output に出す。
  # 未登録でも失敗させず（main の CI を赤くしない）、その旨をログと注釈に出す。
  deploy-secrets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # E2E が落ちた main はデプロイしない。ドキュメントだけの変更（E2E を飛ばした）もデプロイしない
    needs: [check, e2e]
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    steps:
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=デプロイをスキップ::Actions secrets（${missing[*]}）が未登録のため、デプロイしません。登録手順は docs/SETUP.md を参照。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  # main への push で、check と e2e が通ったあとに本番 D1 へのマイグレーション → wrangler deploy を実行する。
  deploy:
    needs: deploy-secrets
    if: needs.deploy-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # デプロイが重ならないようにする。走っている途中のデプロイは止めずに待たせる。
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      # @cloudflare/vite-plugin が dist/ に Worker と wrangler.json を出力し、
      # .wrangler/deploy/config.json で wrangler をそちらへ向ける
      - run: vp run -r build
      # 新しいコードが新しいスキーマを前提にするため、デプロイより先に適用する
      - name: 本番 D1 へのマイグレーション
        working-directory: apps/web
        run: vp exec wrangler d1 migrations apply nanaichi --remote
      - name: wrangler deploy
        id: deploy
        working-directory: apps/web
        # Summary に出すため、出力から Version ID を拾う（pipefail で wrangler の失敗はそのまま落ちる）
        run: |
          vp exec wrangler deploy | tee "$RUNNER_TEMP/wrangler-deploy.log"
          version_id=$(sed -n 's/.*Current Version ID: *\([0-9a-f-]*\).*/\1/p' "$RUNNER_TEMP/wrangler-deploy.log" | head -n 1)
          echo "version-id=$version_id" >> "$GITHUB_OUTPUT"
      # wrangler deploy が 0 で終わっても、本番が新しいコードを配っているとは限らない（Issue #10）
      - name: 本番の確認
        env:
          VERSION_ID: ${{ steps.deploy.outputs.version-id }}
        run: scripts/verify-deploy.sh apps/web/dist/client/index.html
