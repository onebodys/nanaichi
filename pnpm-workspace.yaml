packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# 依存は範囲ではなく正確なバージョンで書く。`pnpm add` でも ^ を付けない。更新は Dependabot の PR で行う
savePrefix: ""

catalog:
  "@base-ui/react": 1.9.0
  "@cloudflare/vite-plugin": 1.64.0
  "@cloudflare/vitest-plugin": 1.4.3
  "@e2e-dev/web": 0.15.1
  "@praha/byethrow": 0.12.0
  "@standard-schema/spec": 1.1.0
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.44
  better-auth: 1.7.9
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  e2e: 0.21.1
  hono: 4.13.13
  knip: 6.41.0
  lucide-react: 1.58.0
  miniflare: 5.20261006.1-alpha
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  valibot: 1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  wrangler: 4.151.0
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
